[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = False
db_name = usbea_production

; Addons paths
addons_path = /mnt/extra-addons,/opt/odoo/src/addons,/opt/odoo/src/odoo/addons

; Server settings
http_port = 8069
proxy_mode = True
without_demo = all

; Logging
log_level = info
logfile = /var/lib/odoo/odoo-server.log

; Performance
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Security
admin_passwd = False
list_db = False

; Data directory
data_dir = /var/lib/odoo
