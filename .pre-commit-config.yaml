# Pre-commit hooks for USBEA custom module development.
# Install: pip install pre-commit && pre-commit install
# Run on all usbea files: pre-commit run --files addons/usbea_*/**/*.py

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        files: ^addons/usbea_
        args: [--fix]
      - id: ruff-format
        files: ^addons/usbea_

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        files: ^addons/usbea_
        args: ["-c", "pyproject.toml", "-ll", "-ii"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(addons/usbea_|docs/)
      - id: end-of-file-fixer
        files: ^(addons/usbea_|docs/)
      - id: check-yaml
        files: ^(addons/usbea_|\.github/)
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
